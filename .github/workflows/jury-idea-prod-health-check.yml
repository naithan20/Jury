name: JURY Idea Endpoint Production Health Check (manual, single request)

# Manual-only, single-shot production health check for
# POST https://tryjury.vercel.app/api/agent/evaluate-idea — the new
# free-text idea/decision evaluation capability. Mirrors
# jury-prod-health-check.yml's guarantees exactly (see that file for the
# fuller rationale): workflow_dispatch only, exactly one HTTP request per
# run, no retries, no AgentGraph involvement, no application code or env
# vars touched here.
#
# Sends the opt-in X-Jury-Diagnostics header so that IF this single request
# fails with a 502, the response includes runIdeaEvaluation.ts's safe
# per-attempt diagnostic classification (error name/type, abort/timeout,
# finishReason, timings — never secrets/prompts/model content) directly in
# this run's job summary. This exists because Vercel's own function-log
# retention on the free plan is too short (~1h) to inspect after the fact —
# see route.ts's diagnosticsRequested() for the exact opt-in gate.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jury-idea-prod-health-check
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Make exactly one request to the live idea-evaluation endpoint
        run: |
          set -uo pipefail

          PAYLOAD_FILE=$(mktemp)
          BODY_FILE=$(mktemp)
          jq -n \
            --arg subject "An online marketplace where AI agents can discover other AI agents and capabilities based on natural-language tasks." \
            --arg goal "Should this idea be pursued?" \
            '{subject: $subject, evaluationGoal: $goal}' > "$PAYLOAD_FILE"

          # Exactly ONE request: no --retry, no loop, no matrix. --max-time
          # bounds this single attempt to just past the route's own 60s
          # maxDuration.
          CURL_EXIT=0
          HTTP_META=$(curl -sS -o "$BODY_FILE" \
            -w '%{http_code}|%{time_total}|%{content_type}' \
            --max-time 65 \
            -X POST "https://tryjury.vercel.app/api/agent/evaluate-idea" \
            -H "Content-Type: application/json" \
            -H "X-Jury-Diagnostics: 1" \
            --data "@$PAYLOAD_FILE") || CURL_EXIT=$?

          HTTP_CODE=$(cut -d'|' -f1 <<< "$HTTP_META")
          TIME_TOTAL=$(cut -d'|' -f2 <<< "$HTTP_META")
          CONTENT_TYPE=$(cut -d'|' -f3 <<< "$HTTP_META")

          IS_JSON="no"
          OK_FIELD=""
          VERDICT_TEXT=""
          RECOMMENDATION=""
          CONFIDENCE=""
          PANEL_LEN=""
          ERROR_CODE=""
          ERROR_MSG=""

          if grep -qi "application/json" <<< "$CONTENT_TYPE"; then
            IS_JSON="yes"
            OK_FIELD=$(jq -r 'if has("ok") then (.ok|tostring) else "missing" end' "$BODY_FILE" 2>/dev/null || echo "unparseable")
            VERDICT_TEXT=$(jq -r '.result.verdict // empty' "$BODY_FILE" 2>/dev/null)
            RECOMMENDATION=$(jq -r '.result.recommendation // empty' "$BODY_FILE" 2>/dev/null)
            CONFIDENCE=$(jq -r '.result.confidence // empty' "$BODY_FILE" 2>/dev/null)
            PANEL_LEN=$(jq -r '.result.panel | length? // empty' "$BODY_FILE" 2>/dev/null)
            ERROR_CODE=$(jq -r '.error.code // empty' "$BODY_FILE" 2>/dev/null)
            ERROR_MSG=$(jq -r '.error.message // empty' "$BODY_FILE" 2>/dev/null)
          fi

          VERSION_FIELD=$(jq -r '.version // empty' "$BODY_FILE" 2>/dev/null)

          # Response-shape check against the published contract: success is
          # {ok:true, version, result:{verdict, recommendation, confidence,
          # panel[8], ...}}, failure is {ok:false, version, error:{code,
          # message}}.
          CONTRACT_CONFORMS="no"
          GENUINE_RESULT="no"
          if [ "$IS_JSON" = "yes" ] && [ -n "$VERSION_FIELD" ]; then
            if [ "$OK_FIELD" = "true" ] && [ -n "$RECOMMENDATION" ] && [ "$PANEL_LEN" = "8" ]; then
              CONTRACT_CONFORMS="yes"
              GENUINE_RESULT="yes"
            elif [ "$OK_FIELD" = "false" ] && [ -n "$ERROR_CODE" ]; then
              CONTRACT_CONFORMS="yes"
            fi
          fi

          QUOTA_ISSUE="no"
          if [ "$HTTP_CODE" = "429" ]; then
            QUOTA_ISSUE="yes ($ERROR_CODE)"
          fi

          # Safe diagnostic classification (see runIdeaEvaluation.ts) — only
          # present when this request failed AND the server had diagnostics
          # enabled. Never contains secrets/prompts/model-generated text.
          HAS_DIAGNOSTICS="no"
          DIAG_TOTAL_ELAPSED=""
          DIAG_RETRY_TRIGGERED=""
          DIAG_SECOND_ATTEMPT=""
          DIAG_BUDGET_EXHAUSTED_BEFORE=""
          DIAG_ATTEMPTS_TABLE=""
          FAILURE_CATEGORY="—"
          if [ "$IS_JSON" = "yes" ] && jq -e '.diagnostics' "$BODY_FILE" >/dev/null 2>&1; then
            HAS_DIAGNOSTICS="yes"
            DIAG_TOTAL_ELAPSED=$(jq -r '.diagnostics.totalElapsedMs // empty' "$BODY_FILE")
            DIAG_RETRY_TRIGGERED=$(jq -r '.diagnostics.outerRetryTriggered // false' "$BODY_FILE")
            DIAG_SECOND_ATTEMPT=$(jq -r '.diagnostics.secondAttemptStarted // false' "$BODY_FILE")
            DIAG_BUDGET_EXHAUSTED_BEFORE=$(jq -r '.diagnostics.budgetExhaustedBeforeAttempt // empty' "$BODY_FILE")
            DIAG_ATTEMPTS_TABLE=$(jq -r '
              (.diagnostics.attempts // [])[]
              | "| \(.attempt) | \(.elapsedMs)ms | \(.remainingBudgetMsAtStart)ms | \(.errorName // "—") | \(.isAINoObjectGeneratedError) | \(.isAPICallError) | \(.apiCallStatusCode // "—") | \(.abortTimedOut) | \(.finishReason // "—") |"
            ' "$BODY_FILE")
            FAILURE_CATEGORY=$(jq -r '
              (.diagnostics.attempts // []) as $a
              | if ($a | any(.abortTimedOut == true))
                  then "A — upstream/model never completed before the deadline (AbortSignal.timeout fired)"
                elif ($a | any(.isAINoObjectGeneratedError == true and .finishReason == "length"))
                  then "C — output was truncated/token-limited (finishReason=length)"
                elif ($a | any(.isAINoObjectGeneratedError == true))
                  then "B — structured output was returned but could not be parsed/validated against the schema"
                elif ($a | any(.isAPICallError == true))
                  then "D — OpenRouter/provider returned an explicit HTTP/API error"
                elif ($a | length) == 0
                  then "E — no attempt even started (budget exhausted before attempt 1 — see budgetExhaustedBeforeAttempt)"
                else "E — another/unclear cause; see the raw attempts table"
                end
            ' "$BODY_FILE")
          fi

          VERDICT="UNKNOWN"
          if [ "$CURL_EXIT" != "0" ]; then
            VERDICT="REQUEST_FAILED (curl exit $CURL_EXIT — connection-level failure, DNS/TLS error, or hit the 65s client-side cap before any HTTP response)"
          elif [ "$HTTP_CODE" = "200" ] && [ "$GENUINE_RESULT" = "yes" ]; then
            VERDICT="ENDPOINT_HEALTHY — 200 with a genuine multi-perspective IdeaResult"
          elif [ "$HTTP_CODE" = "502" ] && [ "$ERROR_CODE" = "UPSTREAM_ERROR" ]; then
            VERDICT="TIMEOUT_CONTROL_WORKING_BUT_UPSTREAM_UNHEALTHY — structured 502 returned before any platform timeout"
          elif [ "$HTTP_CODE" = "504" ]; then
            VERDICT="PLATFORM_TIMEOUT — raw/bare 504 (not our structured error)"
          elif [ "$HTTP_CODE" = "429" ]; then
            VERDICT="RATE_LIMITED_OR_QUOTA — 429 ($ERROR_CODE), do not retry"
          elif [ "$HTTP_CODE" = "503" ] && [ "$ERROR_CODE" = "PUBLIC_ACCESS_DISABLED" ]; then
            VERDICT="PUBLIC_ACCESS_INTENTIONALLY_DISABLED — 503 kill switch is on"
          else
            VERDICT="UNEXPECTED_RESPONSE — see fields above, does not match a known outcome bucket"
          fi

          {
            echo "## JURY /api/agent/evaluate-idea production health check — single request result"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| HTTP status | $HTTP_CODE |"
            echo "| Total duration | ${TIME_TOTAL}s |"
            echo "| Content-Type | $CONTENT_TYPE |"
            echo "| Response looked like JSON | $IS_JSON |"
            echo "| \`version\` field | ${VERSION_FIELD:-—} |"
            echo "| \`ok\` field | ${OK_FIELD:-—} |"
            echo "| Genuine IdeaResult (recommendation + 8-entry panel) | $GENUINE_RESULT |"
            echo "| recommendation | ${RECOMMENDATION:-—} |"
            echo "| confidence | ${CONFIDENCE:-—} |"
            echo "| panel length | ${PANEL_LEN:-—} |"
            echo "| verdict (result.verdict, truncated) | $(echo "${VERDICT_TEXT:-—}" | cut -c1-160) |"
            echo "| error.code | ${ERROR_CODE:-—} |"
            echo "| error.message | ${ERROR_MSG:-—} |"
            echo "| Conforms to published contract | $CONTRACT_CONFORMS |"
            echo "| Quota/rate-limit issue observed | $QUOTA_ISSUE |"
            echo "| curl exit code | $CURL_EXIT |"
            echo ""
            echo "**Outcome bucket: $VERDICT**"
            echo ""
            if [ "$HAS_DIAGNOSTICS" = "yes" ]; then
              echo "### Diagnostic classification (opt-in, this run only)"
              echo ""
              echo "| Field | Value |"
              echo "|---|---|"
              echo "| Total elapsed (server-measured) | ${DIAG_TOTAL_ELAPSED:-—}ms |"
              echo "| Outer retry triggered | ${DIAG_RETRY_TRIGGERED} |"
              echo "| Second attempt started | ${DIAG_SECOND_ATTEMPT} |"
              echo "| Budget exhausted before attempt # | ${DIAG_BUDGET_EXHAUSTED_BEFORE:-—} |"
              echo ""
              echo "| Attempt | Elapsed | Remaining budget at start | error.name | NoObjectGeneratedError | APICallError | statusCode | Abort/timeout fired | finishReason |"
              echo "|---|---|---|---|---|---|---|---|---|"
              if [ -n "$DIAG_ATTEMPTS_TABLE" ]; then
                echo "$DIAG_ATTEMPTS_TABLE"
              else
                echo "| — | no attempt started — see \"Budget exhausted before attempt #\" above | | | | | | | |"
              fi
              echo ""
              echo "**Definitive failure category: $FAILURE_CATEGORY**"
            else
              echo "_No diagnostics in this response — either the request succeeded, diagnostics were disabled server-side (AGENT_IDEA_DIAGNOSTICS_ENABLED=false), or the deployment doesn't yet include this instrumentation._"
            fi
            echo ""
            echo "_Note on retries: this run's diagnostics (above, when present) directly report whether the outer retry fired and whether a second attempt started — this is no longer inferred from timing alone._"
            echo ""
            echo "_Exactly one HTTP request was made in this run, with no retries. This workflow never reruns itself — trigger it again manually only if you want another single data point._"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "=== Outcome bucket: $VERDICT ==="
          if [ "$HAS_DIAGNOSTICS" = "yes" ]; then
            echo "=== Failure category: $FAILURE_CATEGORY ==="
            echo "=== Diagnostics: totalElapsedMs=$DIAG_TOTAL_ELAPSED retryTriggered=$DIAG_RETRY_TRIGGERED secondAttemptStarted=$DIAG_SECOND_ATTEMPT budgetExhaustedBeforeAttempt=${DIAG_BUDGET_EXHAUSTED_BEFORE:-none} ==="
            echo "=== Attempts: $(jq -c '.diagnostics.attempts // []' "$BODY_FILE") ==="
          fi

          rm -f "$PAYLOAD_FILE" "$BODY_FILE"
